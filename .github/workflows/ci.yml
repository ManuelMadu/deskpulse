name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        # os: [macos-latest, windows-latest]  # windows-latest arrives with Phase W (PDD §42)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Dependency boundaries
        run: npm run depcruise

      - name: Format check
        run: npm run format:check

      - name: Typecheck + build
        run: npm run typecheck

      - name: Agent bundle
        run: npm run build -w @deskpulse/system-agent

      - name: Unit & contract tests
        run: npm test

      # Later phases append here:
      #   agent integration + filesystem suites (Phase 1/4)
      #   Playwright Electron E2E with trace upload on failure (Phase 2+)
